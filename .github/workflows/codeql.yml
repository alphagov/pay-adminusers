name: CodeQL

on:
  pull_request:
    branches: [ "master" ]
    paths:
      - 'src/**'
  push:
    branches: [ "master" ]
  schedule:
    # Weekly schedule
    - cron: '43 7 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: "Run CodeQL"
    uses: govuk-pay/pay-ci/.github/workflows/_run-codeql-scan.yml@591ff32de6cd3c9a0f4af2506f8938e7bd5decaa
    with:
      is_java_repo: true
