name: Github Actions Tests

on:
  workflow_call:
    secrets:
      pact_broker_username:
        required: true
      pact_broker_password:
        required: true

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Detect secrets
        uses: govuk-pay/pay-ci/actions/detect-secrets@8597f9957716cb928c22ed66ee0704a24798ce6e

  integration-tests:
    name: "Integration tests and publish pacts"
    uses: govuk-pay/pay-ci/.github/workflows/_run-java-tests-and-publish-pacts.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
    with:
      publish_pacts: true
      java_version: "25"
    secrets:
      pact_broker_username: ${{ secrets.pact_broker_username }}
      pact_broker_password: ${{ secrets.pact_broker_password }}

  pact-providers-contract-tests:
    name: "Provider tests"
    needs: integration-tests
    uses: govuk-pay/pay-ci/.github/workflows/_run-provider-pact-tests-for-consumer.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
    strategy:
      matrix:
        provider: [ 'ledger', 'connector' ]
    with:
      consumer: adminusers
      provider: ${{ matrix.provider }}
      java_version: "25"
    secrets:
      pact_broker_username: ${{ secrets.pact_broker_username }}
      pact_broker_password: ${{ secrets.pact_broker_password }}

  provider-contract-tests:
    needs: integration-tests
    name: "App as provider tests"
    uses: govuk-pay/pay-ci/.github/workflows/_run-app-as-provider-contract-tests.yml@8597f9957716cb928c22ed66ee0704a24798ce6e
    secrets:
      pact_broker_username: ${{ secrets.pact_broker_username }}
      pact_broker_password: ${{ secrets.pact_broker_password }}
    with:
      java_version: "25"

  check-docker-base-images-are-manifests:
    uses: govuk-pay/pay-ci/.github/workflows/_validate_docker_image_is_manifest.yml@591ff32de6cd3c9a0f4af2506f8938e7bd5decaa

